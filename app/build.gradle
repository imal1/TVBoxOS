apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 37

    defaultConfig {
        applicationId 'com.github.tvbox.osc.jun'
        minSdkVersion 33
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packaging {
        // 与 AGP 7 一致压缩 so 与 dex；AGP 8 在 minSdk>=23 / >=28 时默认不压缩，APK 会显著变大
        // （不压缩时下载更大，但安装时无需解压，占用设备空间更少、启动更快，可按需改为 false）
        jniLibs {
            useLegacyPackaging true
        }
        dex {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    flavorDimensions "mode"
    productFlavors {
        java64 {
            dimension "mode"
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python64 {
            dimension "mode"
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
    }

    sourceSets {
        java64 {
            java.srcDirs += 'src/normal/java'
        }
        python64 {
            java.srcDirs += 'src/python/java'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
        }
    }

    // 禁用 ABI 分割
    splits {
        abi {
            enable false // 禁用 ABI 分割
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
//    dexOptions {
//        javaMaxHeapSize "4g"
//        additionalParameters += '--multi-dex'
//        additionalParameters += '--set-max-idx-number=48000'
//        additionalParameters += '--minimal-main-dex'
//    }
}

