// AGP 9 移除了旧 Variant API（applicationVariants / outputFileName），
// 改为在 assemble 完成后把 APK 复制为原来的命名：build/outputs/tvbox/TVBox_<buildType>-<flavor>.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        def taskSuffix = variant.name.capitalize()
        def copyApk = tasks.register("copy${taskSuffix}TvboxApk", Copy) {
            from(variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE))
            include('*.apk')
            into(layout.buildDirectory.dir('outputs/tvbox'))
            rename { "TVBox_${variant.buildType}-${variant.flavorName}.apk" }
        }
        tasks.matching { it.name == "assemble${taskSuffix}" }.configureEach { finalizedBy(copyApk) }
    }
}
