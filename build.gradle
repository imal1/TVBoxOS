// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://storage.googleapis.com/r8-releases/raw" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.chaquo.python:gradle:17.2.0"
    }
}

allprojects {
    repositories {
        // cling / seamless 的官方仓库 4thline.org 已下线，改用仓库内从源码构建的本地副本（见 third_party/m2/README.txt）
        exclusiveContent {
            forRepository {
                maven { url "$rootDir/third_party/m2" }
            }
            filter {
                includeGroup "org.fourthline.cling"
                includeGroup "org.seamless"
            }
        }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        gradlePluginPortal()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
