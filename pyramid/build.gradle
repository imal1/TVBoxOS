plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace 'com.undcover.freedom.pyramid'
    compileSdk 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 28
        python {
            version "3.10"
            // 未设置时 chaquopy 自动查找（Windows: py -3.10，其他: python3.10）；
            // 也可用 -Ppyramid.buildPython=<python3.10 路径> 或在 gradle.properties 中指定
            def customBuildPython = project.findProperty("pyramid.buildPython")
            if (customBuildPython) {
                buildPython(customBuildPython)
            }
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==2.0.2"
                install "requests"
                // jsonpath 在 PyPI 上只有源码包，chaquopy 15+ 只装 wheel，故以单文件形式内置于 src/python/jsonpath.py（0.82.2，MIT）
                install "cachetools"
                install 'pycryptodome'
                install 'beautifulsoup4'
            }
        }
    }

    flavorDimensions "mode"
    productFlavors {
        python64 {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main{
            // Android代码模块
            setRoot "src/main"
            // Python代码模块，也就是你的Python源码所在项目中的文件夹
            python.srcDirs = ["src/python"]
        }
    }
}

dependencies {

}
